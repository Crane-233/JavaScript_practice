<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
    img.first-child {
    width: 400px;
    height: 400px;
    object-fit: cover;
    /* 图片中超出400px*400px的部分直接裁剪 */
    display: block;
    }

/* 使用 class 精准匹配所有缩略图 */
    img.last-child {
        width: 100px;
        height: 100px;
        object-fit: cover;
        margin-top: 10px;
        /* 将元素上方留出的空白区域设置为10个像素 */
        cursor: pointer;
        /* 将鼠标指针（光标）悬停在元素上时，将其形状变为“小手”（即手指指示状态） 
        暗示该元素是可点击的
        cursor指的是计算机的光标 */
    }
    </style>
</head>
<body>
    <div>
        <img class="first-child"  src="sun copy.jpg" alt="">
        <!-- alt 是英文 Alternative Text（替代文本）的缩写。
         它的核心含义是当图片因路径错误、网速过慢或浏览器限制等原因无法正常显示时，
         浏览器用来代替图片展示的文字说明。 -->
    </div>
    <div>
        <img class="last-child" src="sun copy.jpg" alt="">
        <img class="last-child" src="ying copy.jpg" alt="">
        <img class="last-child" src="xuexiao copy.jpg" alt="">
        <img class="last-child" src="wudong copy.jpg" alt="">
    </div>
    <script>
        let img = document.getElementsByTagName("img");
        for (i = 1; i<img.length;i++){
            img[i].onmouseover = function () {
                img[0].src=this.src
            }
        }
    </script>
</body>
</html>
